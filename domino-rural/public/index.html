<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Dominio Rural — Simulador de cortes</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { font-size: 1.4rem; }
    select, button {
      font-size: 1rem;
      padding: 8px 12px;
      margin-right: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1a1d24;
      color: #e6e6e6;
    }
    button { cursor: pointer; background: #c0392b; border: none; }
    button:hover { background: #e74c3c; }
    #btnReset { background: #555; }

    svg { margin-top: 24px; background: #15161a; border-radius: 8px; }

    .linea { stroke: #2ecc71; stroke-width: 4; transition: all 0.3s ease; }
    .linea.cortada { stroke: #c0392b; stroke-dasharray: 8 6; }

    .nodo-circulo { fill: #1a1d24; stroke: #2ecc71; stroke-width: 3; transition: all 0.3s ease; }
    .nodo-circulo.zona-segura { stroke: #3498db; }
    .nodo-circulo.apagado { fill: #0f1115; stroke: #444; opacity: 0.35; }

    .nodo-texto { fill: #e6e6e6; font-size: 12px; font-weight: bold; text-anchor: middle; }
    .nodo-dato { fill: #aaa; font-size: 10px; text-anchor: middle; }
    .nodo-grupo.apagado .nodo-texto,
    .nodo-grupo.apagado .nodo-dato { opacity: 0.35; }

    #resumen {
      margin-top: 16px;
      padding: 14px;
      background: #1a1d24;
      border-radius: 6px;
      border-left: 4px solid #c0392b;
      display: none;
    }
  </style>
</head>
<body>
  <h1>🚧 Simulador de cortes — Dominio Rural</h1>

  <div>
    <select id="selectorCamino"></select>
    <button id="btnSimular">Simular corte</button>
    <button id="btnReset">Restablecer</button>
  </div>

  <div id="resumen"></div>
  <svg id="diagrama" width="800" height="420" viewBox="0 0 800 420"></svg>

  <script>
    const API = 'http://localhost:3002';
    let grafo = null;

    // Posiciones fijas para este dataset de demo (5 nodos conocidos).
    // Si el dataset cambia, hay que ajustar o generar esto dinámicamente.
    const POSICIONES = {
      'zona-segura': { x: 400, y: 60 },
      'est-1':       { x: 220, y: 200 },
      'est-2':       { x: 220, y: 340 },
      'est-3':       { x: 580, y: 200 },
      'est-4':       { x: 580, y: 340 },
    };

    async function cargarGrafo() {
      const res = await fetch(`${API}/api/grafo`);
      grafo = await res.json();

      const selector = document.getElementById('selectorCamino');
      selector.innerHTML = grafo.caminos
        .map(c => `<option value="${c.id}">${c.nombre ?? c.id} (${c.desde} → ${c.hasta})</option>`)
        .join('');

      dibujar([], null);
    }

    function dibujar(idsAislados, idCaminoCortado) {
      const svg = document.getElementById('diagrama');
      let contenido = '';

      // 1. Líneas (caminos) primero, para que queden debajo de los círculos
      grafo.caminos.forEach(c => {
        const desde = POSICIONES[c.desde];
        const hasta = POSICIONES[c.hasta];
        if (!desde || !hasta) return;
        const cortada = c.id === idCaminoCortado ? 'cortada' : '';
        contenido += `<line class="linea ${cortada}" x1="${desde.x}" y1="${desde.y}" x2="${hasta.x}" y2="${hasta.y}" />`;
      });

      // 2. Nodos (establecimientos)
      grafo.nodos.forEach(n => {
        const pos = POSICIONES[n.id];
        if (!pos) return;
        const esZonaSegura = n.id === 'zona-segura';
        const apagado = idsAislados.includes(n.id);
        const claseNodo = ['nodo-circulo', esZonaSegura ? 'zona-segura' : '', apagado ? 'apagado' : ''].join(' ');
        const claseGrupo = ['nodo-grupo', apagado ? 'apagado' : ''].join(' ');

        contenido += `
          <g class="${claseGrupo}">
            <circle class="${claseNodo}" cx="${pos.x}" cy="${pos.y}" r="38" />
            <text class="nodo-texto" x="${pos.x}" y="${pos.y - 4}">${n.nombre.split(' ').slice(0,2).join(' ')}</text>
            ${!esZonaSegura ? `<text class="nodo-dato" x="${pos.x}" y="${pos.y + 12}">🐄 ${n.cabezasGanado}</text>` : ''}
          </g>
        `;
      });

      svg.innerHTML = contenido;
    }

    async function simular() {
      const idCamino = document.getElementById('selectorCamino').value;
      const res = await fetch(`${API}/api/simular-corte`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idCamino })
      });
      const resultado = await res.json();

      const idsAislados = resultado.establecimientosAislados.map(e => e.id);
      dibujar(idsAislados, idCamino);

      const resumen = document.getElementById('resumen');
      resumen.style.display = 'block';
      resumen.innerHTML = `
        <b>${idCamino}</b> se corta →
        ${resultado.establecimientosAislados.length} establecimiento(s) aislado(s) —
        ${resultado.totalCabezasGanado} cabezas de ganado,
        ${resultado.totalCamiones} camión(es) y
        ${resultado.totalToneladas} toneladas sin salida.
      `;
    }

    function reset() {
      dibujar([], null);
      document.getElementById('resumen').style.display = 'none';
    }

    document.getElementById('btnSimular').addEventListener('click', simular);
    document.getElementById('btnReset').addEventListener('click', reset);

    cargarGrafo();
  </script>
</body>
</html>
