services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ultima_ventana}
      POSTGRES_USER: ${POSTGRES_USER:-ultima_ventana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultima_ventana_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ultima_ventana} -d ${POSTGRES_DB:-ultima_ventana}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ultima_ventana_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./:/workspace:ro

volumes:
  ultima_ventana_pgdata:
