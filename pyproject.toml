[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "domino-rural"
version = "1.0.0"
description = "Aplicación de gestión de emergencias agropecuarias"
requires-python = ">=3.11,<3.15"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
web = [
    "Flask",
    "Flask-Cors",
]

[tool.setuptools.packages.find]
include = ["ultima_ventana_ml*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
