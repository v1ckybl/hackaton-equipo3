[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ultima-ventana-ml"
version = "0.1.0"
description = "Pipeline ML sintético de Última Ventana"
requires-python = ">=3.10,<3.15"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.1,<4",
]

[tool.setuptools.packages.find]
include = ["ultima_ventana_ml*"]

